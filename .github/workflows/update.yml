# Scrape les déclarations et publie l'application sur GitHub Pages, toutes les 20 min environ.
# Les tâches planifiées de GitHub sont « au mieux » : en pratique elles partaient toutes les 3 à 7 heures.
# Chaque passage relance donc lui-même le suivant (job « relance ») ; la planification ne sert plus que de secours.
# Prérequis (une fois) : Settings > Pages > Source = "GitHub Actions"
#                        Settings > Secrets and variables > Actions > secret SEC_USER_AGENT = "Nom email@domaine"
name: Mise à jour des données

on:
  schedule:
    - cron: "7,37 * * * *"   # secours : redémarre la chaîne si elle s'est arrêtée (GitHub peut retarder de plusieurs heures)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      # base SQLite + photos conservées d'une exécution à l'autre
      - name: Restaurer la base
        uses: actions/cache/restore@v5
        with:
          path: data
          key: tracker-data-${{ github.run_id }}
          restore-keys: tracker-data-

      - name: Scraper et générer le site
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # notifications Telegram (facultatif) : voir README
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then echo "::error::Secret SEC_USER_AGENT manquant (Settings > Secrets and variables > Actions)"; exit 1; fi
          python -m backend.app.export --out site

      - name: Sauvegarder la base
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data
          key: tracker-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

  # Relance la mise à jour suivante 20 min après le début de celle-ci (même en cas d'échec, pour ne pas casser la chaîne).
  # Un déclenchement manuel (workflow_dispatch) n'est pas soumis aux retards des tâches planifiées.
  relance:
    needs: update
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INTERVAL: "1200"
    steps:
      - name: Attendre puis lancer le passage suivant
        run: |
          started=$(gh run view ${{ github.run_id }} --json startedAt -q .startedAt)
          wait=$(( INTERVAL - ( $(date +%s) - $(date -d "$started" +%s) ) ))
          if [ "$wait" -gt 0 ]; then echo "attente ${wait}s"; sleep "$wait"; fi
          # garde-fou : pas de seconde chaîne si un passage est déjà en attente ou en cours
          pending=$(gh run list --workflow update.yml --limit 20 --json databaseId,status \
            -q '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != "completed")] | length')
          if [ "$pending" = "0" ]; then
            gh workflow run update.yml --ref main && echo "passage suivant lancé"
          else
            echo "un passage est déjà prévu ($pending) : rien à faire"
          fi
