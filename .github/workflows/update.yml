# Scrape les déclarations et publie l'application sur GitHub Pages, toutes les 30 min.
# Prérequis (une fois) : Settings > Pages > Source = "GitHub Actions"
#                        Settings > Secrets and variables > Actions > secret SEC_USER_AGENT = "Nom email@domaine"
name: Mise à jour des données

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      # base SQLite + photos conservées d'une exécution à l'autre
      - name: Restaurer la base
        uses: actions/cache/restore@v5
        with:
          path: data
          key: tracker-data-${{ github.run_id }}
          restore-keys: tracker-data-

      - name: Scraper et générer le site
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then echo "::error::Secret SEC_USER_AGENT manquant (Settings > Secrets and variables > Actions)"; exit 1; fi
          python -m backend.app.export --out site

      - name: Sauvegarder la base
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data
          key: tracker-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
